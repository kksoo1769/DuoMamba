name: Configuration checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  configs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements/checks.txt
      - run: python -m pip install -r requirements/checks.txt
      - run: python scripts/check_configs.py
      - name: Check shell syntax
        run: |
          for script in detection/tools/dist_*.sh segmentation/tools/dist_*.sh; do
            bash -n "$script"
          done
